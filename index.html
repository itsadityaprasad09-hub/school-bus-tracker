<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BusTrack — Know when the bus is close</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --navy: #14213D;
    --navy-deep: #0B1526;
    --bus-yellow: #FFC93C;
    --bus-yellow-dim: #E0AC2B;
    --paper: #F7F3E9;
    --ok: #4CAF7D;
    --warn: #E85D4C;
    --ink: #1A1A1A;
    --line: rgba(255,255,255,0.09);
  }
  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--navy-deep);
    color: var(--paper);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  .stripe{
    height: 6px;
    background: repeating-linear-gradient(90deg, var(--bus-yellow) 0 24px, var(--navy) 24px 48px);
  }
  header.top{
    padding: 20px 20px 14px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-weight:800; font-size: 1.25rem; letter-spacing: -0.02em;
  }
  .brand .dot{
    width:10px; height:10px; border-radius:50%;
    background: var(--ok);
    box-shadow: 0 0 0 4px rgba(76,175,125,0.18);
  }
  .role-badge{
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--navy-deep);
    background: var(--bus-yellow);
    padding: 5px 10px;
    border-radius: 100px;
    font-weight: 700;
  }
  main{ max-width: 480px; margin: 0 auto; padding: 24px 20px 60px; }

  /* --- Landing / role picker --- */
  .hero{ text-align:center; padding: 40px 0 20px; }
  .hero h1{
    font-size: 1.9rem; margin: 0 0 8px; letter-spacing: -0.02em; line-height:1.15;
  }
  .hero p{ color: rgba(247,243,233,0.65); font-size: 0.95rem; margin: 0; }
  .roles{ display:flex; flex-direction:column; gap: 12px; margin-top: 28px; }
  .role-card{
    background: var(--navy);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 18px;
    text-align: left;
    cursor: pointer;
    color: var(--paper);
    display:flex; align-items:center; gap: 14px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .role-card:hover{ border-color: var(--bus-yellow-dim); transform: translateY(-1px); }
  .role-card .icon{
    width: 42px; height:42px; border-radius: 10px;
    background: rgba(255,201,60,0.12);
    display:flex; align-items:center; justify-content:center;
    font-size: 1.3rem; flex-shrink:0;
  }
  .role-card .txt strong{ display:block; font-size: 1rem; }
  .role-card .txt span{ font-size: 0.82rem; color: rgba(247,243,233,0.55); }

  /* --- shared components --- */
  .card{
    background: var(--navy);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card h2{ font-size: 1rem; margin: 0 0 12px; letter-spacing: -0.01em; }
  label{ font-size: 0.78rem; color: rgba(247,243,233,0.6); display:block; margin-bottom: 5px; margin-top: 12px; }
  label:first-child{ margin-top:0; }
  input, select{
    width: 100%;
    background: var(--navy-deep);
    border: 1px solid var(--line);
    color: var(--paper);
    padding: 11px 12px;
    border-radius: 9px;
    font-size: 0.95rem;
    outline: none;
  }
  input:focus, select:focus{ border-color: var(--bus-yellow-dim); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:100%;
    background: var(--bus-yellow);
    color: var(--navy-deep);
    border: none;
    padding: 12px 16px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 16px;
  }
  .btn:active{ transform: scale(0.98); }
  .btn.secondary{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--paper);
  }
  .btn.danger{ background: var(--warn); color: white; }
  .btn.ok{ background: var(--ok); color: white; }
  .backlink{
    background:none; border:none; color: rgba(247,243,233,0.5);
    font-size: 0.85rem; cursor:pointer; padding: 0 0 16px; display:flex; align-items:center; gap:6px;
  }
  .invite-code{
    font-family: 'Courier New', monospace;
    font-size: 1.5rem; letter-spacing: 0.15em; font-weight: 700;
    color: var(--bus-yellow);
    background: var(--navy-deep);
    border: 1px dashed var(--bus-yellow-dim);
    border-radius: 10px;
    padding: 14px;
    text-align:center;
    margin-top: 10px;
  }
  .bus-row{
    display:flex; align-items:center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .bus-row:last-child{ border-bottom:none; }
  .bus-row .name{ font-weight:600; font-size: 0.92rem; }
  .bus-row .sub{ font-size: 0.75rem; color: rgba(247,243,233,0.5); }
  .status-pill{
    font-size: 0.7rem; font-weight:700; padding: 4px 9px; border-radius: 100px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .status-pill.live{ background: rgba(76,175,125,0.18); color: var(--ok); }
  .status-pill.idle{ background: rgba(255,255,255,0.08); color: rgba(247,243,233,0.5); }
  .empty{
    text-align:center; padding: 24px 10px; color: rgba(247,243,233,0.45); font-size: 0.88rem;
  }
  #map{ height: 260px; border-radius: 12px; margin-top: 8px; }
  .trip-status{
    display:flex; align-items:center; gap:10px; padding: 14px; border-radius: 10px;
    background: var(--navy-deep); margin-bottom: 4px;
  }
  .trip-status .pulse{
    width: 12px; height:12px; border-radius:50%; background: var(--ok);
    box-shadow: 0 0 0 0 rgba(76,175,125,0.6);
    animation: pulse 1.6s infinite;
  }
  .trip-status.idle .pulse{ background: rgba(247,243,233,0.3); animation:none; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(76,175,125,0.5); }
    70%{ box-shadow: 0 0 0 10px rgba(76,175,125,0); }
    100%{ box-shadow: 0 0 0 0 rgba(76,175,125,0); }
  }
  .eta{
    font-size: 2rem; font-weight: 800; letter-spacing:-0.02em; color: var(--bus-yellow);
  }
  .eta-label{ font-size: 0.78rem; color: rgba(247,243,233,0.55); }
  .toast{
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bus-yellow); color: var(--navy-deep); font-weight:700;
    padding: 12px 18px; border-radius: 10px; font-size: 0.88rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    opacity:0; pointer-events:none; transition: opacity .25s ease, transform .25s ease;
    z-index: 999; max-width: 90%; text-align:center;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(-4px); }
  .note{
    font-size: 0.78rem; color: rgba(247,243,233,0.45); margin-top: 14px; line-height:1.5;
  }
</style>
</head>
<body>
<div class="stripe"></div>
<header class="top">
  <div class="brand"><span class="dot"></span> BusTrack</div>
  <div id="roleBadge"></div>
</header>

<main id="app"></main>

<div class="toast" id="toast"></div>

<script>
/* ---------- tiny local "backend" via localStorage + storage events ---------- */
const DB_KEY = 'bustrack_db_v1';
function readDB(){
  try { return JSON.parse(localStorage.getItem(DB_KEY)) || { buses: {} }; }
  catch(e){ return { buses: {} }; }
}
function writeDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

// Simulated route around a generic city grid (used to animate the "live" bus)
const ROUTE = [
  [25.6127, 85.1418],[25.6151, 85.1447],[25.6168, 85.1489],[25.6183, 85.1532],
  [25.6179, 85.1581],[25.6155, 85.1614],[25.6121, 85.1636],[25.6089, 85.1602],
  [25.6071, 85.1558],[25.6083, 85.1508],[25.6103, 85.1462]
];

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* ---------- routing between screens ---------- */
const app = document.getElementById('app');
const roleBadge = document.getElementById('roleBadge');
let simInterval = null;

function setBadge(text){ roleBadge.innerHTML = text ? `<span class="role-badge">${text}</span>` : ''; }

function goHome(){
  if(simInterval){ clearInterval(simInterval); simInterval = null; }
  setBadge('');
  app.innerHTML = `
    <div class="hero">
      <h1>Know exactly when<br>the bus is close.</h1>
      <p>One app for principals, drivers, and parents.</p>
    </div>
    <div class="roles">
      <div class="role-card" onclick="goPrincipal()">
        <div class="icon">🏫</div>
        <div class="txt"><strong>Principal</strong><span>Register buses, invite students</span></div>
      </div>
      <div class="role-card" onclick="goDriver()">
        <div class="icon">🚌</div>
        <div class="txt"><strong>Bus Driver</strong><span>Start a trip, share location</span></div>
      </div>
      <div class="role-card" onclick="goStudent()">
        <div class="icon">🎒</div>
        <div class="txt"><strong>Student / Parent</strong><span>See the bus on a live map</span></div>
      </div>
    </div>
    <p class="note">This is a working prototype — data is stored on this device only, so it's best tested by opening BusTrack in a few browser tabs (one per role) to see it sync live.</p>
  `;
}

function backBtn(){ return `<button class="backlink" onclick="goHome()">← Back</button>`; }

/* ---------- PRINCIPAL ---------- */
function goPrincipal(){
  setBadge('Principal');
  render_PrincipalDashboard();
}
function render_PrincipalDashboard(){
  const db = readDB();
  const buses = Object.values(db.buses);
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2>Register a new bus</h2>
      <label>Bus name / number</label>
      <input id="busName" placeholder="e.g. Bus 4 — Kankarbagh Route" />
      <label>Driver's name</label>
      <input id="driverName" placeholder="e.g. Ramesh Kumar" />
      <button class="btn" onclick="createBus()">Register bus</button>
    </div>
    <div class="card">
      <h2>Your buses ${buses.length ? `(${buses.length})` : ''}</h2>
      <div id="busList">
        ${buses.length === 0 ? `<div class="empty">No buses yet. Register one above to get an invite code for students.</div>` : buses.map(b => `
          <div class="bus-row">
            <div>
              <div class="name">${b.name}</div>
              <div class="sub">Driver: ${b.driverName} · Code: ${b.code}</div>
            </div>
            <span class="status-pill ${b.tripActive ? 'live' : 'idle'}">${b.tripActive ? 'Live' : 'Idle'}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
function createBus(){
  const name = document.getElementById('busName').value.trim();
  const driverName = document.getElementById('driverName').value.trim();
  if(!name || !driverName){ toast('Fill in both fields'); return; }
  const db = readDB();
  const id = 'bus_' + Date.now();
  const code = genCode();
  db.buses[id] = { id, name, driverName, code, tripActive:false, lat:null, lng:null, routeIdx:0 };
  writeDB(db);
  toast('Bus registered — share the code with parents');
  render_PrincipalDashboard();
}

/* ---------- DRIVER ---------- */
function goDriver(){
  setBadge('Driver');
  render_DriverPicker();
}
function render_DriverPicker(){
  const db = readDB();
  const buses = Object.values(db.buses);
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2>Select your bus</h2>
      ${buses.length === 0
        ? `<div class="empty">No buses registered yet. Ask your principal to register your bus first.</div>`
        : `<label>Bus</label>
           <select id="busSelect">
             ${buses.map(b => `<option value="${b.id}">${b.name} — ${b.driverName}</option>`).join('')}
           </select>
           <button class="btn" onclick="openDriverTrip()">Continue</button>`
      }
    </div>
  `;
}
function openDriverTrip(){
  const busId = document.getElementById('busSelect').value;
  render_DriverTrip(busId);
}
function render_DriverTrip(busId){
  const db = readDB();
  const bus = db.buses[busId];
  if(!bus){ goDriver(); return; }
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2>${bus.name}</h2>
      <div class="trip-status ${bus.tripActive ? '' : 'idle'}">
        <div class="pulse"></div>
        <div>
          <div style="font-weight:700; font-size:0.92rem;">${bus.tripActive ? 'Trip in progress — location is live' : 'Trip not started'}</div>
          <div class="sub" style="color:rgba(247,243,233,0.5); font-size:0.78rem;">${bus.tripActive ? 'Parents on this bus can see you on the map' : 'Nothing is shared while the trip is stopped'}</div>
        </div>
      </div>
      ${bus.tripActive
        ? `<button class="btn danger" onclick="endTrip('${bus.id}')">End trip</button>`
        : `<button class="btn ok" onclick="startTrip('${bus.id}')">Start trip</button>`
      }
    </div>
    <p class="note">In this prototype, location moves along a simulated route once you start the trip. In a real deployment this would read live GPS from your phone.</p>
  `;
}
function startTrip(busId){
  const db = readDB();
  const bus = db.buses[busId];
  bus.tripActive = true;
  bus.routeIdx = 0;
  bus.lat = ROUTE[0][0]; bus.lng = ROUTE[0][1];
  writeDB(db);
  toast('Trip started — sharing live location');
  if(simInterval) clearInterval(simInterval);
  simInterval = setInterval(() => {
    const db2 = readDB();
    const b = db2.buses[busId];
    if(!b || !b.tripActive){ clearInterval(simInterval); simInterval=null; return; }
    b.routeIdx = (b.routeIdx + 1) % ROUTE.length;
    b.lat = ROUTE[b.routeIdx][0];
    b.lng = ROUTE[b.routeIdx][1];
    writeDB(db2);
  }, 2200);
  render_DriverTrip(busId);
}
function endTrip(busId){
  const db = readDB();
  const bus = db.buses[busId];
  bus.tripActive = false;
  writeDB(db);
  if(simInterval){ clearInterval(simInterval); simInterval = null; }
  toast('Trip ended');
  render_DriverTrip(busId);
}

/* ---------- STUDENT / PARENT ---------- */
function goStudent(){
  setBadge('Parent');
  render_StudentEntry();
}
function render_StudentEntry(){
  app.innerHTML = `
    ${backBtn()}
    <div class="card">
      <h2>Enter your invite code</h2>
      <label>Code from your school</label>
      <input id="codeInput" placeholder="e.g. 7K2P9M" style="text-transform:uppercase; letter-spacing:0.1em;" />
      <button class="btn" onclick="joinBus()">Track my bus</button>
    </div>
  `;
}
let studentMap, studentMarker, studentTrackTimer;
function joinBus(){
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const db = readDB();
  const bus = Object.values(db.buses).find(b => b.code === code);
  if(!bus){ toast('Code not found — check with your school'); return; }
  render_StudentTrack(bus.id);
}
function render_StudentTrack(busId){
  app.innerHTML = `
    ${backBtn()}
    <div class="card" id="statusCard"></div>
    <div class="card" id="mapCard" style="display:none;">
      <h2>Live location</h2>
      <div id="map"></div>
    </div>
  `;
  refreshStudentView(busId);
  if(studentTrackTimer) clearInterval(studentTrackTimer);
  studentTrackTimer = setInterval(() => refreshStudentView(busId), 1500);
}
function refreshStudentView(busId){
  const db = readDB();
  const bus = db.buses[busId];
  if(!bus){ return; }
  const statusCard = document.getElementById('statusCard');
  const mapCard = document.getElementById('mapCard');
  if(!statusCard) return;
  if(bus.tripActive){
    statusCard.innerHTML = `
      <h2>${bus.name}</h2>
      <div class="trip-status">
        <div class="pulse"></div>
        <div>
          <div style="font-weight:700; font-size:0.92rem;">On the way</div>
          <div style="color:rgba(247,243,233,0.5); font-size:0.78rem;">Driver: ${bus.driverName}</div>
        </div>
      </div>
    `;
    mapCard.style.display = 'block';
    if(!studentMap){
      studentMap = L.map('map', { zoomControl:false, attributionControl:false }).setView([bus.lat, bus.lng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(studentMap);
      const busIcon = L.divIcon({ html:'🚌', className:'', iconSize:[28,28] });
      studentMarker = L.marker([bus.lat, bus.lng], { icon: busIcon }).addTo(studentMap);
    } else {
      studentMarker.setLatLng([bus.lat, bus.lng]);
      studentMap.panTo([bus.lat, bus.lng]);
    }
  } else {
    statusCard.innerHTML = `
      <h2>${bus.name}</h2>
      <div class="trip-status idle">
        <div class="pulse"></div>
        <div>
          <div style="font-weight:700; font-size:0.92rem;">No active trip</div>
          <div style="color:rgba(247,243,233,0.5); font-size:0.78rem;">You'll see the bus here once the driver starts the trip</div>
        </div>
      </div>
    `;
    mapCard.style.display = 'none';
    studentMap = null;
  }
}

/* keep views in sync across tabs (e.g. principal tab + driver tab + student tab open together) */
window.addEventListener('storage', (e) => {
  if(e.key === DB_KEY){
    // re-render whatever is currently mounted, cheaply, by re-triggering current role's refresh where relevant
    const badge = roleBadge.textContent;
    if(badge === 'Principal' && document.getElementById('busList')) render_PrincipalDashboard();
  }
});

goHome();
</script>
</body>
</html>
